<main class="container py-4 flex-grow-1">
<h1 class="h3 mb-3">Lost &amp; found items</h1>
<form id="filterForm" action="#" method="GET" class="card card-body shadow-sm mb-4"><div class="row g-2">
  <div class="col-md-4"><input type="search" class="form-control" id="search" name="search" placeholder="Search items&hellip;"></div>
  <div class="col-md-3"><select class="form-select" id="filterCategory" name="category"><option value="">All categories</option><option value="ID">ID</option><option value="Gadget">Gadget</option><option value="Bag">Bag</option><option value="Other">Other</option></select></div>
  <div class="col-md-2"><select class="form-select" id="filterType" name="type"><option value="">Lost &amp; found</option><option value="lost">Lost</option><option value="found">Found</option></select></div>
  <div class="col-md-3"><select class="form-select" id="filterStatus" name="status"><option value="">Any status</option><option value="reported">Reported</option><option value="found">Found</option><option value="claimed">Claimed</option></select></div>
</div></form>
<div class="row g-3" id="itemGrid"></div>
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h2 class="modal-title h5">Delete item</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><p class="mb-0">Delete <strong id="deleteName"></strong>? This is a placeholder; nothing is deleted yet.</p></div>
  <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-danger" data-bs-dismiss="modal">Delete</button></div>
</div></div></div>
</main>
