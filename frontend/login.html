<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | iBULFAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">iBULFAS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li><li class="nav-item"><a class="nav-link" href="register.html">Register</a></li></ul></div>
  </div>
</nav>
</header>
<main class="container py-4 flex-grow-1" style="max-width:460px;">
<h1 class="h3 mb-3 text-center">Log in</h1><div id="alertBox"></div>
<form id="loginForm" action="#" method="POST" class="card card-body shadow-sm">
  <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" name="email" required placeholder="you@bicol-u.edu.ph"></div>
  <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" class="form-control" id="password" name="password" required></div>
  <button type="submit" class="btn btn-primary w-100">Log in</button>
  <p class="text-center small mt-3 mb-0">No account yet? <a href="register.html">Register</a></p>
</form>
</main>
<footer class="border-top bg-white py-3 text-center text-muted small">iBULFAS &middot; Bicol University Polangui &middot; BSIS 2B &ndash; Blazing Pioneers</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
