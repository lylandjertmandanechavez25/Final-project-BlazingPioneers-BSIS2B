<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>Login | Lost &amp; Found</title></head><body>
<div id="nav"></div>
<main class="container">
  <div class="card auth-card"><div class="card-body p-4">
    <h3 class="mb-3 text-center">Welcome back</h3>
    <div id="msg"></div>
    <form id="loginForm" action="#" method="POST" novalidate>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" name="password" required></div>
      <button class="btn btn-primary w-100" type="submit" id="submitBtn">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">No account? <a href="register.html">Register</a></p>
  </div></div>
</main>
<footer class="py-3 mt-5 text-center text-muted small">&copy; 2026 Lost &amp; Found System &middot; IS Elec 2 / IT 112 Final Project</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script></body></html>
