<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>Report Item | Lost &amp; Found</title></head><body>
<div id="nav"></div>
<main class="container my-4" style="max-width:760px">
  <div class="card stat-card"><div class="card-body p-4">
    <h3 class="mb-3"><i class="bi bi-plus-circle text-primary"></i> Report an item</h3>
    <div id="msg"></div>
    <form id="reportForm" action="#" method="POST" novalidate>
      <div class="mb-3">
        <label class="form-label d-block">What happened?</label>
        <div class="btn-group" role="group">
          <input type="radio" class="btn-check" name="type" id="typeLost" value="lost" checked><label class="btn btn-outline-danger" for="typeLost">I lost something</label>
          <input type="radio" class="btn-check" name="type" id="typeFound" value="found"><label class="btn btn-outline-success" for="typeFound">I found something</label>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-7"><label class="form-label" for="title">Item name</label><input class="form-control" id="title" name="title" placeholder="e.g. Black Jansport backpack" required></div>
        <div class="col-md-5"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category" required></select></div>
        <div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="3" placeholder="Color, brand, marks, contents..."></textarea></div>
        <div class="col-md-6"><label class="form-label" for="location">Location</label><input class="form-control" id="location" name="location" placeholder="e.g. Library 2nd floor" required></div>
        <div class="col-md-6"><label class="form-label" for="dateOccurred">Date</label><input type="date" class="form-control" id="dateOccurred" name="dateOccurred" required></div>
        <div class="col-md-6"><label class="form-label" for="contact">Contact info (optional)</label><input class="form-control" id="contact" name="contact" placeholder="Phone or social handle"></div>
        <div class="col-md-6"><label class="form-label" for="imageUrl">Image URL (optional)</label><input type="url" class="form-control" id="imageUrl" name="imageUrl" placeholder="https://..."></div>
      </div>
      <button class="btn btn-primary mt-4" type="submit" id="submitBtn"><i class="bi bi-send"></i> Submit report</button>
    </form>
  </div></div>
</main>
<footer class="py-3 mt-5 text-center text-muted small">&copy; 2026 Lost &amp; Found System &middot; IS Elec 2 / IT 112 Final Project</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/report.js"></script></body></html>
