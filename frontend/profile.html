<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | iBULFAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="dashboard.html">iBULFAS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="items.html">Items</a></li><li class="nav-item"><a class="nav-link" href="report-item.html">Report</a></li><li class="nav-item"><a class="nav-link" href="claim.html">Claims</a></li><li class="nav-item dropdown"><a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Manage (Staff/Admin)</a><ul class="dropdown-menu"><li><a class="dropdown-item" href="inventory.html">Inventory</a></li><li><a class="dropdown-item" href="manage-users.html">Users</a></li></ul></li><li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li><li class="nav-item"><a class="nav-link" href="login.html">Log out</a></li></ul></div>
  </div>
</nav>
</header>
<main class="container py-4 flex-grow-1">
<h1 class="h3 mb-3">My profile</h1><div id="alertBox"></div>
<div class="row g-3">
  <div class="col-md-4"><div class="card shadow-sm text-center"><div class="card-body">
    <div class="avatar mx-auto mb-3">U</div><h2 class="h5 mb-1" id="profileName">User Name</h2><span class="badge text-bg-secondary">informant</span>
    <p class="small text-muted mt-2 mb-3">Member since <span id="createdAt">&mdash;</span></p><button type="button" class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#passwordModal">Change password</button></div></div></div>
  <div class="col-md-8"><form id="profileForm" action="#" method="POST" class="card card-body shadow-sm">
    <div class="row">
      <div class="col-md-6 mb-3"><label for="idNumber" class="form-label">BU ID number</label><input type="text" class="form-control" id="idNumber" name="idNumber" readonly></div>
      <div class="col-md-6 mb-3"><label for="fullName" class="form-label">Full name</label><input type="text" class="form-control" id="fullName" name="fullName" required></div>
      <div class="col-md-6 mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
      <div class="col-md-6 mb-3"><label for="contactNumber" class="form-label">Contact number</label><input type="tel" class="form-control" id="contactNumber" name="contactNumber" ></div>
      <div class="mb-3"><label for="course" class="form-label">Course (optional)</label><input type="text" class="form-control" id="course" name="course" ></div>
    </div><div><button type="submit" class="btn btn-primary">Save changes</button></div>
  </form></div>
</div>
<div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h2 class="modal-title h5">Change password</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><form id="passwordForm" action="#" method="POST"><div class="mb-3"><label for="currentPassword" class="form-label">Current password</label><input type="password" class="form-control" id="currentPassword" name="currentPassword" required></div><div class="mb-3"><label for="newPassword" class="form-label">New password</label><input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="6"></div></form></div>
  <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Update</button></div>
</div></div></div>
</main>
<footer class="border-top bg-white py-3 text-center text-muted small">iBULFAS &middot; Bicol University Polangui &middot; BSIS 2B &ndash; Blazing Pioneers</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
