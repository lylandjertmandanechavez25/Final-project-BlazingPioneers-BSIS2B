<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>Profile | Lost &amp; Found</title></head><body>
<div id="nav"></div>
<main class="container"><div class="card auth-card"><div class="card-body p-4">
  <h3 class="mb-3 text-center"><i class="bi bi-person-circle"></i> My profile</h3>
  <div id="msg"></div>
  <form id="profileForm" action="#" method="POST">
    <div class="mb-3"><label class="form-label">Name</label><input id="name" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Email</label><input id="email" class="form-control" disabled></div>
    <div class="mb-3"><label class="form-label">Role</label><input id="role" class="form-control" disabled></div>
    <div class="mb-3"><label class="form-label">New password (optional)</label><input type="password" id="password" class="form-control" minlength="6"></div>
    <button class="btn btn-primary w-100" type="submit">Save changes</button>
  </form>
</div></div></main>
<footer class="py-3 mt-5 text-center text-muted small">&copy; 2026 iBULFAS &middot; Bicol University Polangui</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/profile.js"></script></body></html>
