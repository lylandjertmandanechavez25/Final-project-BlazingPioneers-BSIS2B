<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>Admin | Lost &amp; Found</title></head><body>
<div id="nav"></div>
<main class="container my-4">
  <h3 class="mb-3"><i class="bi bi-shield-lock text-primary"></i> Admin &ndash; User management</h3>
  <input id="userSearch" class="form-control mb-3" style="max-width:320px" placeholder="Search name or email">
  <div class="card stat-card"><div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light"><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th class="text-end">Actions</th></tr></thead>
      <tbody id="userRows"><tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr></tbody>
    </table>
  </div></div>
</main>
<div class="modal fade" id="editModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <form id="editForm" action="#" method="POST">
    <div class="modal-header"><h5 class="modal-title">Edit user</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><input type="hidden" id="editId">
      <div class="mb-3"><label class="form-label">Name</label><input id="editName" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input id="editEmail" class="form-control" disabled></div>
      <div class="mb-3"><label class="form-label">Role</label><select id="editRole" class="form-select"><option value="user">User</option><option value="admin">Admin</option></select></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-warning" type="submit">Save</button></div>
  </form>
</div></div></div>
<footer class="py-3 mt-5 text-center text-muted small">&copy; 2026 iBULFAS &middot; Bicol University Polangui </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script></body></html>
