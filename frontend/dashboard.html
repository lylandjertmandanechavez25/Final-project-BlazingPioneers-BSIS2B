<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>Browse Items | Lost &amp; Found</title></head><body>
<div id="nav"></div>
<main class="container my-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Browse items</h3>
    <a href="report.html" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Report item</a>
  </div>
  <div class="card stat-card mb-4"><div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-md-4"><label class="form-label small mb-1">Search</label><input id="fSearch" class="form-control" placeholder="Title, description or location"></div>
      <div class="col-6 col-md-2"><label class="form-label small mb-1">Type</label><select id="fType" class="form-select"><option value="">All</option><option value="lost">Lost</option><option value="found">Found</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label small mb-1">Category</label><select id="fCategory" class="form-select"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label small mb-1">Status</label><select id="fStatus" class="form-select"><option value="">All</option><option value="open">Open</option><option value="claimed">Claimed</option><option value="returned">Returned</option></select></div>
      <div class="col-6 col-md-2"><div class="form-check"><input class="form-check-input" type="checkbox" id="fMine"><label class="form-check-label" for="fMine">My reports</label></div></div>
    </div>
  </div></div>
  <div id="itemList" class="row g-3"></div>
  <nav class="mt-4"><ul class="pagination justify-content-center" id="pager"></ul></nav>
</main>

<!-- View / Claim modal -->
<div class="modal fade" id="viewModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="viewTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="viewBody"></div>
</div></div></div>

<!-- Edit modal -->
<div class="modal fade" id="editModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <form id="editForm" action="#" method="POST">
    <div class="modal-header"><h5 class="modal-title">Edit report</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><input type="hidden" id="editId">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Item name</label><input id="editTitle" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Type</label><select id="editType" class="form-select"><option value="lost">Lost</option><option value="found">Found</option></select></div>
        <div class="col-md-3"><label class="form-label">Status</label><select id="editStatus" class="form-select"><option value="open">Open</option><option value="claimed">Claimed</option><option value="returned">Returned</option></select></div>
        <div class="col-md-6"><label class="form-label">Category</label><select id="editCategory" class="form-select" required></select></div>
        <div class="col-md-6"><label class="form-label">Date</label><input type="date" id="editDate" class="form-control" required></div>
        <div class="col-12"><label class="form-label">Location</label><input id="editLocation" class="form-control" required></div>
        <div class="col-12"><label class="form-label">Description</label><textarea id="editDescription" class="form-control" rows="3"></textarea></div>
        <div class="col-md-6"><label class="form-label">Contact</label><input id="editContact" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Image URL</label><input id="editImage" class="form-control"></div>
      </div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-warning" type="submit">Save changes</button></div>
  </form>
</div></div></div>
<footer class="py-3 mt-5 text-center text-muted small">&copy;2026 iBULFAS &middot; Bicol University Polangui </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script></body></html>
