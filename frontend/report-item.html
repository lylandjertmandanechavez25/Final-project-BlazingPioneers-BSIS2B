<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report an Item | iBULFAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #miniMap { height: 300px; border-radius: .5rem; }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="dashboard.html">iBULFAS</a>
    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="items.html">Items</a>
      <a class="nav-link active" href="report-item.html">Report</a>
      <a class="nav-link" href="profile.html">Profile</a>
      <a class="nav-link" href="#" onclick="logout()">Log out</a>
    </div>
  </div>
</nav>

<main class="container py-4" style="max-width: 760px;">
  <h1 class="h3 mb-1">Report an item</h1>
  <p class="text-muted">Fill in the details so the owner or finder can recognize the item.</p>

  <div id="alertBox"></div>

  <form id="reportForm" class="card card-body shadow-sm">
    <div class="mb-3">
      <label class="form-label d-block">This item was</label>
      <div class="btn-group" role="group">
        <input type="radio" class="btn-check" name="type" id="typeLost" value="lost" checked>
        <label class="btn btn-outline-danger" for="typeLost">Lost</label>
        <input type="radio" class="btn-check" name="type" id="typeFound" value="found">
        <label class="btn btn-outline-success" for="typeFound">Found</label>
      </div>
    </div>

    <div class="mb-3">
      <label for="itemName" class="form-label">Item name</label>
      <input type="text" class="form-control" id="itemName" required placeholder="e.g. Black umbrella">
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" required>
          <option value="">Select category</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label for="dateLostFound" class="form-label">Date lost or found</label>
        <input type="date" class="form-control" id="dateLostFound" required>
      </div>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" rows="3" placeholder="Color, brand, marks, contents"></textarea>
    </div>

    <div class="mb-3">
      <label for="locationId" class="form-label">Location</label>
      <select class="form-select" id="locationId" required>
        <option value="">Select location</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Pin the exact spot (click the map)</label>
      <div id="miniMap"></div>
      <div class="form-text" id="pinText">No pin selected.</div>
    </div>

    <div class="mb-3" id="storedAtGroup" style="display:none;">
      <label for="storedAt" class="form-label">Where is the item kept now?</label>
      <input type="text" class="form-control" id="storedAt" placeholder="e.g. Security office">
    </div>

    <div class="mb-3">
      <label class="form-label d-block">Photo (optional)</label>
      <input type="file" id="image" accept="image/*" hidden>
      <button type="button" class="btn btn-outline-secondary" id="addImageBtn">Add image</button>
      <button type="button" class="btn btn-link text-danger" id="removeImageBtn" hidden>Remove</button>
      <div class="form-text" id="imageHelp">JPG or PNG, up to 2 MB.</div>
      <img id="imagePreview" class="img-thumbnail mt-2" alt="Selected photo preview"
           style="max-height:200px;" hidden>
    </div>

    <button type="submit" class="btn btn-primary">Submit report</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script>
  requireLogin();

  // ---- Mini map (Leaflet). Center: BU Polangui, palitan kung hindi accurate ----
  const map = L.map("miniMap").setView([13.2970, 123.4860], 17);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  let marker = null;
  let pin = null; // { lat, lng } - tugma sa "pin" field sa ERD
  map.on("click", (e) => {
    pin = { lat: e.latlng.lat, lng: e.latlng.lng };
    if (marker) marker.setLatLng(e.latlng); else marker = L.marker(e.latlng).addTo(map);
    document.getElementById("pinText").textContent =
      `Pin: ${pin.lat.toFixed(5)}, ${pin.lng.toFixed(5)}`;
  });

  // ---- Fill dropdowns ----
  // Palitan ang endpoint kung iba ang routes niyo
  async function loadOptions() {
    try {
      const [cats, locs] = await Promise.all([api("/categories"), api("/locations")]);
      fillSelect("category", cats, (c) => c.name);
      fillSelect("locationId", locs, (l) => l.name + (l.building ? ` (${l.building})` : ""));
    } catch (err) { showAlert(err.message, "danger"); }
  }
  function fillSelect(id, list, label) {
    const el = document.getElementById(id);
    list.forEach((x) => {
      const opt = document.createElement("option");
      opt.value = id === "category" ? x.name : x._id; // category = String sa ERD, location = ObjectId
      opt.textContent = label(x);
      el.appendChild(opt);
    });
  }
  loadOptions();

  // Staff/Admin lang ang may "stored at" kapag found item
  const user = getUser();
  document.querySelectorAll('input[name="type"]').forEach((r) =>
    r.addEventListener("change", () => {
      const isFound = document.getElementById("typeFound").checked;
      document.getElementById("storedAtGroup").style.display =
        isFound && user && user.role !== "informant" ? "block" : "none";
    })
  );

  function showAlert(msg, type) {
    document.getElementById("alertBox").innerHTML =
      `<div class="alert alert-${type}">${msg}</div>`;
  }

  // ---- Submit ----
  document.getElementById("reportForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!pin) return showAlert("Click the map to pin the location.", "warning");

    // Para sa image: pinakasimple muna ay i-convert sa base64 (imageUrl).
    // Kung gagamit kayo ng multer sa backend, palitan ng FormData.
    const file = document.getElementById("image").files[0];
    const imageUrl = file ? await toBase64(file) : "";

    const body = {
      itemName: document.getElementById("itemName").value.trim(),
      description: document.getElementById("description").value.trim(),
      category: document.getElementById("category").value,
      type: document.querySelector('input[name="type"]:checked').value,
      imageUrl,
      locationId: document.getElementById("locationId").value,
      pin,
      storedAt: document.getElementById("storedAt").value.trim(),
      dateLostFound: document.getElementById("dateLostFound").value
      // reportedBy at status: sa backend dapat i-set (galing sa token, default "reported")
    };

    try {
      await api("/items", { method: "POST", body: JSON.stringify(body) });
      showAlert("Report submitted.", "success");
      setTimeout(() => (window.location.href = "items.html"), 1200);
    } catch (err) { showAlert(err.message, "danger"); }
  });

  // ---- Image picker with preview ----
  const imageInput = document.getElementById("image");
  const preview = document.getElementById("imagePreview");
  const removeBtn = document.getElementById("removeImageBtn");
  const addBtn = document.getElementById("addImageBtn");
  const MAX_SIZE = 2 * 1024 * 1024; // 2 MB

  addBtn.addEventListener("click", () => imageInput.click());

  imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      clearImage();
      return showAlert("Please choose an image file (JPG or PNG).", "warning");
    }
    if (file.size > MAX_SIZE) {
      clearImage();
      return showAlert("Image is too large. Choose one under 2 MB.", "warning");
    }
    document.getElementById("alertBox").innerHTML = "";
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    removeBtn.hidden = false;
    addBtn.textContent = "Change image";
  });

  removeBtn.addEventListener("click", clearImage);

  function clearImage() {
    imageInput.value = "";
    preview.hidden = true;
    preview.removeAttribute("src");
    removeBtn.hidden = true;
    addBtn.textContent = "Add image";
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
