<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | iBULFAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<script src="js/register.js"></script>

<header>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">iBULFAS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="login.html">Login</a></li><li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li></ul></div>
  </div>
</nav>
</header>
<main class="container py-4 flex-grow-1" style="max-width:640px;">
<h1 class="h3 mb-1 text-center">Create an account</h1><p class="text-muted text-center">New accounts start as <strong>informant</strong>. An admin can change roles later.</p><div id="alertBox"></div>
<form id="registerForm" action="#" method="POST" class="card card-body shadow-sm">
  <div class="row">
    <div class="col-md-6 mb-3"><label for="idNumber" class="form-label">BU ID number</label><input type="text" class="form-control" id="idNumber" name="idNumber" required placeholder="e.g. 2024-12345"></div>
    <div class="col-md-6 mb-3"><label for="fullName" class="form-label">Full name</label><input type="text" class="form-control" id="fullName" name="fullName" required></div>
    <div class="col-md-6 mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
    <div class="col-md-6 mb-3"><label for="contactNumber" class="form-label">Contact number</label><input type="tel" class="form-control" id="contactNumber" name="contactNumber" placeholder="09XXXXXXXXX"></div>
    <div class="mb-3"><label for="course" class="form-label">Course (students only, optional)</label><input type="text" class="form-control" id="course" name="course" placeholder="e.g. BSIS 2B"></div>
    <div class="col-md-6 mb-3"><label for="password" class="form-label">Password</label><input type="password" class="form-control" id="password" name="password" required minlength="6"></div>
    <div class="col-md-6 mb-3"><label for="confirmPassword" class="form-label">Confirm password</label><input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required></div>
  </div>
  <button type="submit" class="btn btn-primary">Register</button>
  <p class="small mt-3 mb-0">Already registered? <a href="login.html">Log in</a></p>
</form>
</main>
<footer class="border-top bg-white py-3 text-center text-muted small">iBULFAS &middot; Bicol University Polangui &middot; BSIS 2B &ndash; Blazing Pioneers</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
