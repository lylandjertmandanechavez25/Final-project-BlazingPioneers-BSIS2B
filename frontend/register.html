<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>Register | Lost &amp; Found</title></head><body>
<div id="nav"></div>
<main class="container">
  <div class="card auth-card"><div class="card-body p-4">
    <h3 class="mb-3 text-center">Create an account</h3>
    <div id="msg"></div>
    <form id="registerForm" action="#" method="POST" novalidate>
      <div class="mb-3"><label class="form-label" for="name">Full name</label><input type="text" class="form-control" id="name" name="name" required></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" name="password" minlength="6" required><div class="form-text">At least 6 characters.</div></div>
      <div class="mb-3"><label class="form-label" for="confirm">Confirm password</label><input type="password" class="form-control" id="confirm" required></div>
      <button class="btn btn-primary w-100" type="submit" id="submitBtn">Register</button>
    </form>
    <p class="text-center mt-3 mb-0">Already registered? <a href="login.html">Login</a></p>
  </div></div>
</main>
<footer class="py-3 mt-5 text-center text-muted small">&copy; 2026 Lost &amp; Found System &middot; IS Elec 2 / IT 112 Final Project</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/register.js"></script></body></html>
